name: trainspotting

services:
  api:
    build:
      context: .
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://trainspotting:trainspotting_dev_only@mysql:3306/trainspotting?charset=utf8mb4}
      AUTO_MIGRATE_DATABASE: ${AUTO_MIGRATE_DATABASE:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./react-ui
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: trainspotting
      MYSQL_USER: trainspotting
      MYSQL_PASSWORD: trainspotting_dev_only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - trainspotting_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  trainspotting_mysql_data:
