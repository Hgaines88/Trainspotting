name: Application check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: application-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-check:
    name: Full application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4.11
        env:
          MYSQL_DATABASE: trainspotting
          MYSQL_USER: trainspotting
          MYSQL_PASSWORD: trainspotting_ci_only
          MYSQL_ROOT_PASSWORD: trainspotting_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=trainspotting_root_ci_only --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 20s

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-ui/package-lock.json

      - name: Scan tracked files for secrets
        run: python -m scripts.check_secrets

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Permit non-root creation of append-only audit triggers
        run: >-
          .venv/bin/python -c
          "import pymysql;
          connection = pymysql.connect(host='127.0.0.1', user='root', password='trainspotting_root_ci_only');
          connection.cursor().execute('SET GLOBAL log_bin_trust_function_creators = 1');
          connection.close()"

      - name: Apply schema and run MySQL integration tests
        env:
          DATABASE_URL: mysql+pymysql://trainspotting:trainspotting_ci_only@127.0.0.1:3306/trainspotting?charset=utf8mb4
          MYSQL_TEST_DATABASE_URL: mysql+pymysql://trainspotting:trainspotting_ci_only@127.0.0.1:3306/trainspotting?charset=utf8mb4
        run: |
          .venv/bin/python -m scripts.migrate_database
          .venv/bin/python -m pytest -q tests/test_mysql_schema.py tests/test_mysql_runtime.py

      - name: Install frontend dependencies
        working-directory: react-ui
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: react-ui
        run: npx playwright install --with-deps chromium

      - name: Run backend and clean-database tests
        run: .venv/bin/python -m pytest -q

      - name: Verify canonical archive round trip
        run: |
          .venv/bin/python -m scripts.init_db
          .venv/bin/python -m scripts.archive_data check

      - name: Run frontend unit tests
        working-directory: react-ui
        run: npm test

      - name: Lint frontend
        working-directory: react-ui
        run: npm run lint

      - name: Build production frontend
        working-directory: react-ui
        run: npm run build

      - name: Run isolated browser workflow
        working-directory: react-ui
        run: npm run test:e2e

      - name: Build encrypted backup worker
        run: docker build --file Dockerfile.backup --tag trainspotting-backup:ci .

      - name: Upload browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            react-ui/playwright-report/
            react-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
