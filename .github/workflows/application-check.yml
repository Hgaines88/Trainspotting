name: Application check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: application-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-check:
    name: Full application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-ui/package-lock.json

      - name: Scan tracked files for secrets
        run: python -m scripts.check_secrets

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: react-ui
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: react-ui
        run: npx playwright install --with-deps chromium

      - name: Run backend and clean-database tests
        run: pytest -q

      - name: Run frontend unit tests
        working-directory: react-ui
        run: npm test

      - name: Lint frontend
        working-directory: react-ui
        run: npm run lint

      - name: Build production frontend
        working-directory: react-ui
        run: npm run build

      - name: Run isolated browser workflow
        working-directory: react-ui
        run: npm run test:e2e

      - name: Upload browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            react-ui/playwright-report/
            react-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
