<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="/styles.css">
    <title>Collection | Trainspotting</title>
</head>
<body>
    <nav class="site-header"><a class="brand" href="/"><span>TRAINSPOTTING</span><small>FASHION HISTORY IN MOTION</small></a><div class="signal-stack"><span class="signal"><i></i> LIVE DATABASE <b>CH. 001</b></span><span class="signature">(h)gaines.</span></div></nav><div class="ticker">DESIGNER → LABEL → SEASON → IMAGE → MOVEMENT → MEMORY → DESIGNER → LABEL → SEASON →</div>

    <main>
        <p id="status">Loading collection...</p>

        <article id="collection" hidden>
            <div class="collection-heading">
                <span id="label-monogram" class="label-monogram"></span>
                <div><p id="collection-label" class="eyebrow"></p><h1 id="collection-title"></h1></div>
            </div>
            <div id="collection-designer"><span>Credits:</span><ol id="collection-credits"></ol></div>
            <p id="collection-season"></p>
            <p id="collection-status"></p>
            <p id="collection-piece-count"></p>
            <p id="collection-description"></p>
            <section id="collection-media" hidden>
                <h2>Runway media</h2>
                <div id="collection-video" class="video-frame" hidden></div>
                <p id="collection-source"></p>
            </section>
        </article>
    </main>

    <footer class="site-footer"><span>PUBLIC ACCESS / OPEN ARCHIVE</span><span class="digital-signature">(h)gaines.</span><span class="footer-year">NYC</span></footer>

    <script src="/layout.js" defer></script>
    <script src="/collection.js" defer></script>
</body>
</html>
