<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="/styles.css">
    <title>Add Designer | Trainspotting</title>
</head>
<body>
    <nav class="site-header"><a class="brand" href="/"><span>TRAINSPOTTING</span><small>FASHION HISTORY IN MOTION</small></a><div class="signal-stack"><span class="signal"><i></i> LIVE DATABASE <b>CH. 001</b></span><span class="signature">(h)gaines.</span></div></nav><div class="ticker">DESIGNER → LABEL → SEASON → IMAGE → MOVEMENT → MEMORY → DESIGNER → LABEL → SEASON →</div>

    <main>
        <p class="eyebrow">ARCHIVE EDITOR / DESIGNER</p><h1 id="form-title">Add a Designer</h1>

        <p id="status"></p>

        <form id="designer-form">
            <p>
                <label for="full-name">Full name</label><br>
                <input
                    id="full-name"
                    name="full_name"
                    type="text"
                    required
                >
            </p>

            <p>
                <label for="nationality">Nationality</label><br>
                <input
                    id="nationality"
                    name="nationality"
                    type="text"
                >
            </p>

            <p>
                <label for="birth-year">Birth year</label><br>
                <input
                    id="birth-year"
                    name="birth_year"
                    type="number"
                    min="1800"
                    max="2100"
                >
            </p>

            <p>
                <label for="website">Website</label><br>
                <input
                    id="website"
                    name="website"
                    type="text"
                    inputmode="url"
                    placeholder="www.example.com"
                >
            </p>

            <p>
                <label for="biography">Biography</label><br>
                <textarea
                    id="biography"
                    name="biography"
                    rows="6"
                ></textarea>
            </p>

            <button id="submit-button" type="submit">
                Save designer
            </button>
        </form>
    </main>

    <footer class="site-footer"><span>PUBLIC ACCESS / OPEN ARCHIVE</span><span class="digital-signature">(h)gaines.</span><span class="footer-year">NYC</span></footer>

    <script src="/layout.js" defer></script>
    <script src="/api.js" defer></script>
    <script src="/designer-form.js" defer></script>
</body>
</html>
