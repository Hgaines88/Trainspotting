<!doctype html>
<html lang="en">
<head>

        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="/styles.css">
    <title>Designer | Trainspotting</title>
</head>
<body>
    <nav class="site-header"><a class="brand" href="/"><span>TRAINSPOTTING</span><small>FASHION HISTORY IN MOTION</small></a><div class="signal-stack"><span class="signal"><i></i> LIVE DATABASE <b>CH. 001</b></span><span class="signature">(h)gaines.</span></div></nav><div class="ticker">DESIGNER → LABEL → SEASON → IMAGE → MOVEMENT → MEMORY → DESIGNER → LABEL → SEASON →</div>

            <div class="actions">
            <p>
                <a id="add-collection-link" href="#">
                    Add a collection
                </a>
            </p>
            <p>
                <a id="edit-designer" href="#">
                    Edit designer
                </a>
            </p>
            <p>
                <button id="delete-designer" type="button">
                    Delete designer
                </button>
            </p>
            </div>
            <section class="section"><div class="section-heading"><h2>Collections</h2><span id="collection-count"></span></div><ul id="collection-list" class="collection-list"></ul></section>
        </section>
    </main>

    <footer class="site-footer"><span>PUBLIC ACCESS / OPEN ARCHIVE</span><span class="digital-signature">(h)gaines.</span><span class="footer-year">NYC</span></footer>
